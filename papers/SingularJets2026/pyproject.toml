[project]
name = "singularjets2026-capsule"
version = "0.1.0"
description = "Locked figure-reproduction environment for the SingularJets2026 data capsule"
requires-python = "==3.12.*"
dependencies = [
  "matplotlib==3.11.0",
  "numpy==2.4.6",
  "scipy==1.17.1",
]

[dependency-groups]
dev = [
  "pytest==9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
