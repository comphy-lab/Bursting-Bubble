name: SingularJets figure rendering

on:
  pull_request:
    paths:
      - "papers/SingularJets2026/**"
      - ".github/workflows/singularjets2026-offline.yml"
  push:
    branches: [main]
    paths:
      - "papers/SingularJets2026/**"
      - ".github/workflows/singularjets2026-offline.yml"

permissions:
  contents: read

jobs:
  render-figures:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: papers/SingularJets2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install plotting dependencies
        run: python -m pip install numpy scipy matplotlib
      - name: Render main and supplemental figures
        run: make figures-main figures-supp NO_TEX=1
